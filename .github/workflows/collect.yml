name: collect
on:
  push:
    paths: ['collect-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: stages
        run: |
          rm -f data/collect_log.txt
          bash scripts/run_stage.sh hotspawn   python3 scripts/collect_hotspawn.py
          bash scripts/run_stage.sh lines      python3 scripts/collect_lines.py
          bash scripts/run_stage.sh results    python3 scripts/collect_results.py
          bash scripts/run_stage.sh model      python3 scripts/build_model.py
      - name: commit
        if: always()
        run: |
          git config user.name "arena-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || git commit -m "data: refresh collectors [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
