name: collect
on:
  push:
    paths: ['collect-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: hotspawn inventory
        run: python3 scripts/collect_hotspawn.py
      - name: market lines
        run: python3 scripts/collect_lines.py
      - name: historical results (Leaguepedia)
        continue-on-error: true
        run: python3 scripts/collect_results.py
      - name: commit
        run: |
          git config user.name "arena-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A data || true
          git diff --cached --quiet || git commit -m "data: refresh collectors [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
