name: Update Hotspawn LoL Picks

# Refreshes the Hotspawn League of Legends Pick'em board every 6 hours
# (inside the requested 4-8 hour window). No manual input required.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/b041f9d1-lolhotspawn5'
    paths:
      - "scripts/**"
      - ".github/workflows/update-picks.yml"

permissions:
  contents: write

concurrency:
  group: picks-update
  cancel-in-progress: false

jobs:
  update-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Leaguepedia history cache
        uses: actions/cache@v4
        with:
          path: data/leaguepedia_cache.json
          # The Actions cache is immutable per key, so the key must change every
          # run for the refreshed history to be saved; restore-keys then picks up
          # the most recent entry.
          key: leaguepedia-cache-v1-${{ github.run_id }}
          restore-keys: |
            leaguepedia-cache-v1-

      - name: Run pick generation pipeline
        id: pipeline
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        continue-on-error: true
        run: |
          mkdir -p research
          python3 -u scripts/update_picks.py 2>&1 | tee research/pipeline.log
          echo "pipeline_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Persist run log
        if: always()
        run: |
          git config user.name "hotspawn-picks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add research
          git diff --cached --quiet || git commit -m "chore: pipeline run log $(date -u +%Y-%m-%dT%H%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && break || sleep 5; done
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Fail job if pipeline failed
        if: steps.pipeline.outputs.pipeline_exit != '0'
        run: |
          echo "::error::pick generation pipeline exited non-zero"
          exit 1

      - name: Verify data integrity
        run: |
          python3 - <<'EOF'
          import json, re, sys

          with open("data/picks.json") as f:
              data = json.load(f)
          with open("data/flagged.json") as f:
              flagged = json.load(f)

          n = data.get("count", 0)
          assert n > 0, "No matches found in picks data!"

          allowed = {"MARKET", "MODEL", "UNRESOLVED"}
          ids = set()
          for m in data["matches"]:
              fid = m["fixture_id"]
              assert fid not in ids, f"Duplicate fixture id: {fid}"
              ids.add(fid)
              assert m["pick"] in (m["team1"], m["team2"]), f"Invalid pick: {fid}"
              assert abs((m["prob_team1"] + m["prob_team2"]) - 1.0) < 0.001, f"Probs != 1: {fid}"
              assert m["method"] in allowed, f"Unknown method {m['method']} on {fid}"
              assert re.match(r"^https://www\.hotspawn\.com/matches/[a-z0-9-]+-\d{5,9}$",
                              m["hotspawn_match_url"]), f"Bad permalink: {m['hotspawn_match_url']}"
              assert m["sources"], f"No sources for {fid}"
              for s in m["sources"]:
                  assert s["url"].startswith("https://"), f"Non-https source on {fid}"
              if m["method"] == "UNRESOLVED":
                  assert abs(m["prob_team1"] - 0.5) < 1e-9, f"Unresolved row not 50/50: {fid}"

          # every unresolved row must appear in the flagged set
          fl_ids = {i["fixture_id"] for i in flagged["items"] if i["kind"] == "unresolved-pick"}
          un_ids = {m["fixture_id"] for m in data["matches"] if m["method"] == "UNRESOLVED"}
          assert fl_ids == un_ids, "flagged.json unresolved set does not match picks.json"

          acc = data["debug"].get("permalink_rule_accuracy")
          print(f"permalink slug rule accuracy: {acc}")

          print(f"Verification passed: {n} fixtures, "
                f"{data['coverage']['resolved']} resolved / {data['coverage']['unresolved']} unresolved, "
                f"{flagged['count']} flagged items")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "hotspawn-picks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "picks: automated refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && break || sleep 5
            done
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
