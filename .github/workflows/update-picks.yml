name: Update Hotspawn LoL Picks (Every 6h)

on:
  schedule:
    - cron: "0 */6 * * *"   # Runs every 6 hours (within requested 4-8h window)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-picks.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: picks-update
  cancel-in-progress: false

jobs:
  update-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pick generation pipeline
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 scripts/update_picks.py

      - name: Verify data integrity
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("docs/data/picks.json") as f:
              data = json.load(f)
          assert data.get("count", 0) > 0, "No matches found in picks data!"
          for m in data["matches"]:
              assert m["pick"] in (m["team1"], m["team2"]), f"Invalid pick: {m}"
              assert abs((m["prob_team1"] + m["prob_team2"]) - 1.0) < 0.001, f"Probabilities do not sum to 1: {m}"
              assert m["method"] in ("MARKET_BOOKS", "MARKET_POLYMARKET", "MODEL_ELO", "UNRESOLVED"), f"Unknown method: {m}"
          print(f"Data verification passed: {data['count']} total matches priced successfully.")
          EOF

      - name: Synchronize web assets
        run: |
          cp -f docs/data/picks.json data/picks.json || true
          cp -rf docs/* . || true

      - name: Commit and push changes
        run: |
          git config user.name "hotspawn-picks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs/data index.html picks.html unresolved.html flagged.html methodology.html assets docs
          git diff --cached --quiet || git commit -m "picks: automated 6h refresh [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
