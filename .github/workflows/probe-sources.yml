name: probe-sources

on:
  workflow_dispatch:
  push:
    branches:
      - arena/3552c64a-lolhotspawn5
    paths:
      - 'scripts/probe.py'
      - 'scripts/probe_targets*.json'
      - '.github/workflows/probe-sources.yml'

permissions:
  contents: write

concurrency:
  group: probe-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe round 1 (baseline sources)
        run: python scripts/probe.py --targets scripts/probe_targets.json --out evidence/raw
      - name: Probe round 2 (routes + reference data)
        run: python scripts/probe.py --targets scripts/probe_targets_2.json --out evidence/raw2
      - name: Probe round 3 (reference data deep dive)
        run: python scripts/probe.py --targets scripts/probe_targets_3.json --out evidence/raw3
      - name: Probe round 4 (reference data fallback ladder)
        run: python scripts/probe.py --targets scripts/probe_targets_4.json --out evidence/raw4
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A evidence
          if git diff --cached --quiet; then
            echo 'no evidence changes'
          else
            git commit -m 'chore(probe): refresh raw source evidence'
            git push origin HEAD:arena/3552c64a-lolhotspawn5
          fi
