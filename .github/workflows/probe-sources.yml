name: probe-sources

on:
  workflow_dispatch:
  push:
    branches:
      - arena/3552c64a-lolhotspawn5

permissions:
  contents: write

concurrency:
  group: probe-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe candidate sources
        run: python scripts/probe.py
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A evidence
          if git diff --cached --quiet; then
            echo 'no evidence changes'
          else
            git commit -m 'chore(probe): refresh raw source evidence'
            git push origin HEAD:arena/3552c64a-lolhotspawn5
          fi
