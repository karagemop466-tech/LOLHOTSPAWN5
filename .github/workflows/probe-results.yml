name: probe-results
on:
  push:
    paths: ['probe-results-trigger.txt']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 scripts/probe_schema.py
      - name: commit
        if: always()
        run: |
          git config user.name "arena-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A research || true
          git diff --cached --quiet || git commit -m "research: cargo schema probe [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
