name: probe
on:
  push:
    paths: ['probe-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run probe
        run: bash scripts/probe.sh
      - name: commit results
        run: |
          git config user.name "arena-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A probe || true
          git diff --cached --quiet || git commit -m "probe: diagnostics [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
