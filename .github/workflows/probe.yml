name: probe-hotspawn-api

# Discovery helper. Runs on push to this branch because the agent sandbox has no
# outbound network access (only github.com / npmjs / pypi are reachable from it).
#
# It dumps the raw HTML of the Hotspawn Play LoL lobby, lists every <script src> and
# API-looking URL it finds, probes candidate API hosts/paths, and writes the report
# to research/probe-results.md so the agent can read it via `git pull`.

on:
  push:
    branches:
      - 'arena/b041f9d1-lolhotspawn5'
    paths:
      - '.github/workflows/probe.yml'
      - 'scraper/probe.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        run: bash scraper/probe.sh 2>&1 | tee research/probe-results.txt

      - name: Commit report
        run: |
          git config user.name  "hotspawn-bot"
          git config user.email "hotspawn-bot@users.noreply.github.com"
          git add research/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "probe: hotspawn api discovery results"
            git push
          fi

      - name: Upload raw probe output
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe/
