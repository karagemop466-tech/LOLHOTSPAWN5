name: probe-egress
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test egress to data sources
        run: |
          set +e
          for u in https://play.hotspawn.com/lol-pickems https://www.hotspawn.com/matches https://lol.fandom.com/api.php https://oracleselixir.com https://www.oddsportal.com https://polymarket.com https://www.esportbet.com https://gg.bet https://www.betway.com https://liquipedia.net ; do
            printf "%-45s " "$u"
            curl -s -o /dev/null -w "%{http_code} %{size_download}b %{time_total}s\n" --max-time 20 -A "Mozilla/5.0" "$u"
            echo ""
          done
